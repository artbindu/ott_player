<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>MediaPlayerLabs</title><link rel="icon" type="image/x-icon" href="favicon.ico"><link rel="stylesheet" href="style.css"/><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/><script defer="defer" src="bundle.f5cd70ad1abeaa6e9670.js"></script><script defer="defer" src="bundle.411441338be3744b2c99.js"></script><link href="style.fcd742f53b1e89c30837.css" rel="stylesheet"><link href="style.304c420b5b632022c210.css" rel="stylesheet"></head><body><div class="container"><button id="toggle-sidebar" title="Toggle Sidebar">☰</button><section class="left-container"><div class="container-first"><a href="" target="_blank"><h6 class="site-subtitle" id="player-version">OTT Player</h6></a></div><div class="container-second"><select id="asset-select" title="Select Asset"><option value="" selected="selected">Select Asset</option></select></div><hr><div class="container-fourth settings-row"><label for="period-list">Periods:</label> <select id="period-list" title="Available Periods"><option value="auto" selected="selected">Auto</option></select></div><div class="container-fourth settings-row"><label for="video-list">Video Track:</label> <select id="video-list" title="Available Video Tracks"><option value="auto" selected="selected">Auto</option></select></div><div class="container-fourth settings-row"><label for="video-resolution-quality">Video Quality:</label> <select id="video-resolution-quality" title="Available Video Quality"><option value="auto" selected="selected">Auto</option></select></div><div class="container-five settings-row"><label for="audio-list">Audio Track:</label> <select id="audio-list" title="Available Audio Tracks"><option value="auto" selected="selected">Auto</option></select></div><div class="container-five settings-row"><label for="audio-resolution-quality">Audio Quality:</label> <select id="audio-resolution-quality" title="Available Audio Quality"><option value="auto" selected="selected">Auto</option></select></div><div class="container-six settings-row"><label for="subtitle-list">Subtitles:</label> <select id="subtitle-list" title="Available Subtitles"><option value="off" selected="selected">Off</option></select></div><hr><div class="container-seven"><h4>Selected Tracks</h4><p>State: <span id="current-state">N/A</span></p><p>Period: <span id="current-period">N/A</span></p><p>Video: <span id="current-video">N/A</span></p><p>Audio: <span id="current-audio">N/A</span></p><p>Subtitle: <span id="current-subtitle">N/A</span></p></div></section><section class="right-container"><div class="video-video-controls"><div class="video-layer"><video id="video"></video><div class="subtitle-layer"></div></div><div class="seekbar"><div class="time-display current-time">00:00:00</div><div class="seekbar-container"><input type="range" id="progress" min="0" max="100" value="0"/><div class="tooltip" id="progress-tooltip">0%</div></div><div class="time-display end-time">00:00:00</div></div><div class="control-buttons"><button id="restart" title="Restart"><i class="fa fa-redo"></i></button> <button id="rewind" title="Rewind"><i class="fa fa-backward"></i></button> <button id="play-pause" title="Play"><i class="fa fa-play"></i></button> <button id="fast-forward" title="Fast Forward"><i class="fa fa-forward"></i></button> <button id="stop" title="Stop"><i class="fa fa-stop"></i></button> <span id="mute"><i class="fa fa-volume-up"></i></span> <input type="range" id="volume" min="0" max="1" step="0.01" value="1" title="VolumeBar"/> <select id="playback-speed" title="Playback Speed"><option value=".25">0.25x</option><option value=".5">0.5x</option><option value="1" selected="selected">Auto</option><option value="1.5">1.5x</option><option value="2">2x</option></select> <button id="pip-btn" title="Picture-in-Picture"><i class="fa fa-window-restore"></i></button></div></div></section></div></body></html>
